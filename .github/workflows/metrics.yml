name: GitHub Metrics

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # GitHub Statistics - Dark
      # ==============================
      - name: Generate dark statistics
        uses: lowlighter/metrics@latest
        with:
          filename: assets/card-stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          user: harsh6131

          template: classic

          base: header, activity, community, repositories, metadata

          config_display: large
          config_timezone: Asia/Kolkata
          config_theme: github_dark

          repositories: 100
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: false


      # ==============================
      # GitHub Statistics - Light
      # ==============================
      - name: Generate light statistics
        uses: lowlighter/metrics@latest
        with:
          filename: assets/card-stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          user: harsh6131

          template: classic

          base: header, activity, community, repositories, metadata

          config_display: large
          config_timezone: Asia/Kolkata
          config_theme: default

          repositories: 100
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: false


      # ==============================
      # Most Used Languages
      # ==============================
      - name: Generate languages
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          user: harsh6131

          base: ""

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          plugin_languages_sections: most-used
          plugin_languages_categories: programming, markup

          config_timezone: Asia/Kolkata
          config_theme: github_dark


      # ==============================
      # GitHub Achievements
      # ==============================
      - name: Generate achievements
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.achievements.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          user: harsh6131

          base: ""

          plugin_achievements: yes
          plugin_achievements_display: compact

          config_timezone: Asia/Kolkata
          config_theme: github_dark


      # ==============================
      # Commit generated SVG files
      # ==============================
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update GitHub metrics"
            git push
          fi
